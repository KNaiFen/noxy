configLanguage=Config comment language: auto follows the client game language, or the server system locale; zh_cn / en_us overrides it. Restart to apply. Keys and values are identical in both versions.
configVersion=Config schema version. Older files (including files without a version) are backed up and upgraded on startup, preserving supported valid values and adding new defaults.
RECEIVE=Receive LODs from the server.
RECEIVE_RADIUS=Radius in chunks; 0 follows Voxy render distance.
DOWNLOAD_KBPS=Download limit in KiB/s; 0 uses the server allowance.
RECEIVE_MIB=Receive buffer memory in MiB.
REQUEST_WINDOW=Outstanding columns, including server work, transfer and client application; at most 64 columns per request message.
INDEX_MIB=Client coverage index memory in MiB.
RECEIVE_DUTY=Ordered receive worker CPU duty cycle; preserves update order.
ENABLED=Generate real chunks outside vanilla view distance in singleplayer.
RADIUS=Local generation radius in chunks, also limited by Voxy render distance.
PRESET=Local generation load preset; CUSTOM uses the custom section.
QUEUE=Maximum pending columns including generation, snapshots and conversion.
MEMORY=Reserved snapshot memory in MiB.
THREADS=Conversion worker threads for the CUSTOM preset.
CONCURRENCY=Concurrent generation tasks for the CUSTOM preset.
PER_SECOND=Submitted columns per second for the CUSTOM preset.
SNAPSHOT_MS=Main thread snapshot budget per tick in milliseconds for CUSTOM.
DUTY=Conversion worker CPU duty cycle for CUSTOM.
SERVER_ENABLED=Enable the server LOD service.
SERVER_GENERATE=Load/generate chunks when the LOD cache is missing.
SERVER_RADIUS=Maximum server LOD radius in chunks.
BANDS=Inclusive radius:minimum level. The final level extends to the receive boundary; levels increase with distance.
TOTAL_MBPS=Global LOD payload limit in megabits/s, including protocol headers.
PLAYER_KBPS=Per-player upload limit in KiB/s; 0 adds no per-player limit.
COMPRESSION_LEVEL=Zstd level for network payloads; cache storage stays at level 1. Higher levels use more worker CPU.
MAX_BATCH_COLUMNS=Maximum columns compressed together; 1 sends individual columns. Credit, bytes and one tick of waiting can produce smaller batches.
PLAYER_SEND_MIB=Per-player queued send memory in MiB.
TOTAL_SEND_MIB=Total queued send memory in MiB.
DIRTY_TICKS=Ticks between dirty-column invalidation notifications.
SERVER_CACHE_MIB=RocksDB block cache in MiB; online changes briefly pause LOD work while reopening the database.
SERVER_PRESET=Server load preset; CUSTOM uses the custom section.
PLAYER_CONCURRENCY=Separate per-player concurrency limits for cache reads and generation. Waiting generation does not occupy cache read slots.
PLAYER_REQUEST_QUEUE=Maximum pending requests per player in columns.
SERVER_QUEUE=Maximum server work queue in columns.
BACKGROUND_CONCURRENCY=Maximum concurrent background refresh columns; new background work pauses while foreground requests are pending.
BACKGROUND_RATE=Maximum background refresh submissions per second, also subject to global rate and TPS/MSPT throttling.
SERVER_MEMORY=Server snapshot memory budget in MiB.
GENERATION_TIMEOUT=Maximum seconds waiting for chunks, lighting and snapshots after a column starts loading/generation. Timeout releases its ticket and slot and allows client retry. Throttle admission waits are excluded.
AUTO_THROTTLE=Enable sustained TPS/MSPT load protection for new generation only. Existing LOD cache reads and sends continue. Disabling resets throttle state.
SLOW_MS=Slow down after average MSPT stays strictly above this value for slowTriggerTicks consecutive ticks.
PAUSE_MS=Pause after average MSPT stays strictly above this value for pauseTriggerTicks consecutive ticks.
RESUME_MS=Recovery requires average MSPT strictly below this value, and sampled TPS at least resumeAboveTps.
PAUSE_TPS=Pause when TPS derived from each tick interval stays strictly below this value for pauseTriggerTicks consecutive ticks. An isolated stall is not counted repeatedly.
RESUME_TPS=Minimum one-second sampled TPS required for recovery.
RESUME_SECONDS=Continuous healthy seconds before recovery starts; applies to slowing and paused states.
SLOW_TICKS=Consecutive ticks above slowAboveMillis before slowing; a healthy tick resets the count.
PAUSE_TICKS=Consecutive ticks above pauseAboveMillis OR below pauseBelowTps before pausing. MSPT and TPS use independent counters; a good tick resets its counter.
RECOVERY_SECONDS=Seconds to ramp from zero to full speed after healthySeconds; 0 restores full speed immediately.
SERVER_THREADS=Server conversion worker threads for CUSTOM.
SERVER_CONCURRENCY=Separate server cache read and generation concurrency limits for CUSTOM, each still subject to its memory budget.
SERVER_RATE=Separate cache read and generation submissions per second for CUSTOM. TPS/MSPT throttling only scales generation.
SERVER_SNAPSHOT_MS=Server main thread snapshot budget per tick in milliseconds for CUSTOM.
SERVER_DUTY=Server conversion worker CPU duty cycle for CUSTOM.
IMPORT_THREADS=Exclusive import workers; 0 selects CPU count minus two (1..32). Ignores live generation throttles.
IMPORT_MEMORY=Exclusive import NBT/snapshot budget in MiB; 0 uses one eighth of max heap (64..1024). Not a total JVM memory limit.
DEBUG=Write LOD throughput, queues, throttle transitions and database IO diagnostics to latest.log at INFO level.
DEBUG_VERBOSE=Trace transfers, batch columns, receipts, work waits and slow database operations (25ms+). Enable briefly on both peers; requires debug.enabled.
DEBUG_MESH=Trace individual mesh decisions separately from transfer diagnostics. Very large logs; keep off for network investigations; requires debug.enabled.
DEBUG_INTERVAL=Seconds between throughput, queue, credit, database IO and timing summaries.
