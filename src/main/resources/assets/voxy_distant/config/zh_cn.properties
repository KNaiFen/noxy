configLanguage=配置注释语言：auto 跟随客户端游戏语言，独立服务器跟随系统语言；可指定 zh_cn 或 en_us。重启生效。两个版本的参数名和值完全相同。
configVersion=配置结构版本。启动时自动备份并升级旧配置（无版本号也视为旧版），保留有效的现有参数并补齐新项默认值。
RECEIVE=接收服务端远景。
RECEIVE_RADIUS=接收半径（区块）；0 跟随 Voxy 渲染距离。设置得更远可提前下载并缓存，显示距离仍由 Voxy 控制；仍受服务器上限和索引预算限制。
DOWNLOAD_KBPS=下载上限（KiB/s）；0 使用服务端允许的带宽。
RECEIVE_MIB=接收缓冲内存（MiB）。
REQUEST_WINDOW=未完成请求窗口（列），包含服务端处理、传输和客户端应用；每条请求消息最多 64 列。
REGION_QUERY_WINDOW=同时等待服务端缓存核验的区域查询数，范围 1～32，默认 4。调高增加核验并发，仍受服务端处理、内存和带宽限制；调低后等待已有查询完成再补充。
REQUEST_COLUMNS_PER_TICK=客户端每 tick 最多提交多少列 LOD 请求。调高会增加索引查询、请求流量和服务端负载；仍受未完成窗口及服务端每人上限约束。
INDEX_MIB=客户端覆盖索引内存（MiB）。
RECEIVE_DUTY=有序接收线程 CPU 占空比；保持更新顺序。
MOVEMENT_PREDICTION=移动预测同时作用于服务端接收与单人本地生成。关闭恢复圆形；后侧最小 0.5 倍，前方最大 1.5 倍。
MOVEMENT_START=开始变形的水平速度（格/秒），默认 2.15，持续移动 6 tick 后启动。
MOVEMENT_MAXIMUM=达到最大变形的水平速度（格/秒），默认 22，须大于开始速度。
MOVEMENT_SECONDS=直线预测时长（秒），默认 0.5；预测偏移使用实际水平速度，不预测转弯。
ENABLED=单人游戏中，在原版视距外生成真实区块。
RADIUS=本地生成半径（区块），同时受 Voxy 渲染距离限制。
PRESET=本地生成负载预设；CUSTOM 使用 custom 中的自定义参数。
QUEUE=待处理列数上限，包含区块生成、快照与转换。
MEMORY=快照预留内存（MiB）。
LOCAL_SCAN_COLUMNS_PER_TICK=客户端每 tick 最多检查多少列以寻找本地生成缺口。调高可更快发现待生成列，但增加客户端主线程覆盖索引查询耗时。
THREADS=CUSTOM 预设的转换线程数。
CONCURRENCY=CUSTOM 预设的区块生成并发数。
PER_SECOND=CUSTOM 预设每秒提交列数。
SNAPSHOT_MS=CUSTOM 预设主线程每 tick 快照预算（毫秒）。
DUTY=CUSTOM 预设转换线程 CPU 占空比。
SERVER_ENABLED=启用服务端远景服务。
SERVER_GENERATE=LOD 缓存缺失时加载或生成区块。
SERVER_RADIUS=服务端远景最大半径（区块）。
BANDS=分档格式为 包含边界的半径:最低层级；最后一档延伸至接收边界，层级随距离递增。
TOTAL_MBPS=全服 LOD 上传上限（Mbps），包含协议头。
PLAYER_KBPS=每玩家上传上限（KiB/s）；0 不增加单人限速。
COMPRESSION_LEVEL=网络载荷的 Zstd 压缩等级；缓存存储固定为等级 1。高等级消耗更多工作线程 CPU。
MAX_BATCH_COLUMNS=单次合批压缩列数上限；1 为逐列传输。信用、字节预算和等待一个 tick 均可能提前发送小批次。
PLAYER_SEND_MIB=每玩家发送排队内存（MiB）。
TOTAL_SEND_MIB=全服发送排队内存（MiB）。
DIRTY_TICKS=脏列失效通知间隔（tick）。
LIGHT_CHANGES_PER_TICK=服务端每 tick 最多将多少个光照变化列标记为脏列。调高可更快传播远景缓存失效，但增加服务端主线程开销。
DIRTY_COLUMNS_PER_FLUSH=每次最多持久化并通知多少个脏列。调高可更快清理积压，但增加服务端主线程、通知及数据库写入负载。
MISSING_CHECKS_PER_FLUSH=每次最多提交多少个缺失列检查。调高可更快清理积压，但增加服务端主线程及数据库工作量。
PLAYER_REQUESTS_PER_TICK=服务端每 tick 最多接收每位玩家多少列 LOD 请求；超额请求会要求重试。调高会增加请求处理及后续缓存读取/生成负载；此项不是扫描上限。
SERVER_CACHE_MIB=RocksDB 块缓存（MiB）；在线修改会短暂停止远景工作并重新打开数据库。
SERVER_PRESET=服务端负载预设；CUSTOM 使用 custom 中的自定义参数。
PLAYER_CONCURRENCY=每玩家缓存读取与生成各自的并发列数上限；生成等待不占用缓存读取名额。
PLAYER_REQUEST_QUEUE=每玩家待调度请求队列上限（列）。
SERVER_QUEUE=服务端任务队列上限（列）。
BACKGROUND_CONCURRENCY=后台刷新最大并发列数；前台请求有积压时暂停启动新任务。
BACKGROUND_RATE=后台刷新每秒最多提交列数；仍受全服速率和 TPS/MSPT 节流限制。
BACKGROUND_SCAN_COLUMNS_PER_PASS=后台每次分别读取的待刷新和待检查缺失索引条目数。调高可能更快发现后台任务，但增加数据库 IO 和工作线程占用；每类内存待处理队列最多保留 512 条。
SERVER_MEMORY=服务端快照内存预算（MiB）。
GENERATION_TIMEOUT=单列开始加载/生成后等待区块、光照及快照的最长秒数；超时释放 ticket 和并发名额并允许客户端重试。尚未获准开始的节流等待不计入。
AUTO_THROTTLE=启用持续 TPS/MSPT 负载保护，仅限制新增生成；已有 LOD 缓存读取和发送继续。关闭时清除节流状态。
SLOW_MS=平均 MSPT 连续 slowTriggerTicks 个 tick 严格高于此值时开始减速。
PAUSE_MS=平均 MSPT 连续 pauseTriggerTicks 个 tick 严格高于此值时暂停。
RESUME_MS=恢复要求平均 MSPT 严格低于此值，同时采样 TPS 不低于 resumeAboveTps。
PAUSE_TPS=按每 tick 间隔计算的 TPS 连续 pauseTriggerTicks 个 tick 严格低于此值时暂停；单次卡顿不会被重复计数。
RESUME_TPS=恢复所需的一秒采样 TPS 下限。
RESUME_SECONDS=开始恢复前必须连续健康的秒数，对减速和暂停均生效。
SLOW_TICKS=触发减速需要连续超过 slowAboveMillis 的 tick 数；未超阈值即清零。
PAUSE_TICKS=触发暂停需要连续超过 pauseAboveMillis 或低于 pauseBelowTps 的 tick 数。MSPT 与 TPS 分别计数，各自恢复即清零。
RECOVERY_SECONDS=满足 healthySeconds 后，从零恢复至全速所需秒数；0 表示立即恢复全速。
SERVER_THREADS=服务端 CUSTOM 预设转换线程数。
SERVER_CONCURRENCY=服务端 CUSTOM 预设缓存读取与生成各自的并发列任务数，内存预算仍分别生效。
SERVER_RATE=服务端 CUSTOM 预设缓存读取与生成各自的每秒提交上限；仅生成速率受 TPS/MSPT 节流影响。
SERVER_SNAPSHOT_MS=服务端 CUSTOM 预设主线程每 tick 快照预算（毫秒）。
SERVER_DUTY=服务端 CUSTOM 预设转换线程 CPU 占空比。
IMPORT_THREADS=独占导入线程数；0 自动选择 CPU 数减二（1～32）。不受在线生成节流限制。
IMPORT_MEMORY=独占导入 NBT/快照预算（MiB）；0 使用最大堆的八分之一（64～1024）。此值不是 JVM 总内存上限。
DEBUG=将远景吞吐、队列、节流切换和数据库 IO 诊断以 INFO 级别写入 latest.log。
DEBUG_VERBOSE=逐条记录传输、合批成员、回执、工作等待和慢数据库操作（25ms+）。建议两端短时开启；需要 debug.enabled。
DEBUG_MESH=独立记录逐项网格决策，不随 verbose 开启。日志量极大，排查网络传输时保持关闭；需要 debug.enabled。
DEBUG_INTERVAL=吞吐、队列、信用、数据库 IO 及耗时汇总间隔（秒）。
